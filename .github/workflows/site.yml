name: Build and deploy predictions site

on:
  schedule:
    # Twice an hour, off the top of the hour. GitHub delays scheduled runs
    # most at :00, and in practice an hourly "0 * * * *" fired every four
    # to five hours; two off-minute entries make it far more likely a build
    # lands inside a pick's two-hour lock window. Picks also lock on news
    # (final injury report + forecast), so most do not depend on this.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs are dispatched from the repository's default branch,
      # whatever that happens to be. Pin the checkout so the published site is
      # always built from main rather than from whichever branch is default.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site
        run: python -m engine.cli site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
