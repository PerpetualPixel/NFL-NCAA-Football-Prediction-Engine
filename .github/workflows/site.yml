name: Build and deploy predictions site

on:
  schedule:
    # Hourly. Picks lock two hours before kickoff, so a four-hour cadence
    # could miss that window entirely; rebuilding every hour guarantees the
    # locked version is published in time and carries the latest odds,
    # inactives and lineup news.
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs are dispatched from the repository's default branch,
      # whatever that happens to be. Pin the checkout so the published site is
      # always built from main rather than from whichever branch is default.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site
        run: python -m engine.cli site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
